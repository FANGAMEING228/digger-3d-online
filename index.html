<script>
(function(){
function box(id,col,bg){
 var b=document.getElementById(id);
 if(!b){b=document.createElement('div');b.id=id;b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;'+bg+';'+col+';font:bold 12px "Courier New",monospace;padding:8px 12px;white-space:pre-wrap;border-top:3px solid currentColor';(document.body||document.documentElement).appendChild(b)}
 return b;
}
window.__err=function(m){try{var b=box('ebx','color:#ffb3b3','background:#4a0e0e');b.style.display='block';b.textContent='ПОМИЛКА: '+m}catch(e){}};
window.__warn=function(){try{
 var ms=[];if(!window.THREE)ms.push('three.js (3D)');if(!window.Peer)ms.push('peerjs (мультиплеер)');
 if(!ms.length)return;
 var b=box('wbx','color:#ffe9a0','background:#4a3a0e');b.style.display='block';
 b.textContent='⚠ Не завантажилось з інтернету: '+ms.join(' + ')+'. Перевір інтернет і перезавантаж сторінку.';
}catch(e){}};
window.addEventListener('error',function(e){var m=(e&&e.message)?e.message:String(e),ln=(e&&e.lineno)?(' (рядок '+e.lineno+')'):'';window.__err(m+ln)});
window.addEventListener('load',function(){setTimeout(window.__warn,700)});
})();

<style>
:root{--c:#2a2c26;--r:#a3521f;--rb:#c9701f;--p:#8fbf3f;--pd:#4d6b26;--b:#cfc9a8;--w:#d4b106;--bl:#7a2020}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--b);font-family:'Courier New',monospace;overflow:hidden}
button{font-family:inherit}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:linear-gradient(180deg,#20221a,#141510);border-bottom:4px solid var(--r);position:relative;z-index:5}
#topbar h1{font-size:18px;margin:0;color:var(--w);text-shadow:2px 2px 0 #000}
#topbar h1 span{color:var(--p)}
#sub{font-size:11px;color:#8a876f}
#bAdm{background:#20221a;border:1px solid #4c4c3a;color:#a7a48c;font-size:13px;font-weight:900;padding:4px 8px;cursor:pointer}
#stamp{border:2px solid var(--bl);color:var(--bl);padding:2px 8px;font-size:11px;transform:rotate(-4deg);font-weight:900;cursor:pointer}
#wrap{display:flex;height:calc(100% - 52px)}
#stage{flex:1;position:relative;background:#000;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 40%,rgba(0,0,0,.75) 100%)}
#stage.low #vig{animation:fl 2.2s infinite;background:radial-gradient(ellipse at 50% 55%,rgba(80,10,10,0) 35%,rgba(90,10,10,.55) 100%)}
#stage.raid #vig{animation:rf 1s infinite}
@keyframes fl{0%,100%{opacity:1}45%{opacity:.55}72%{opacity:.7}}
@keyframes rf{0%,100%{background:radial-gradient(ellipse at 50% 55%,rgba(120,10,10,0) 25%,rgba(170,20,20,.6) 100%)}50%{background:radial-gradient(ellipse at 50% 55%,rgba(10,20,130,0) 25%,rgba(20,40,170,.55) 100%)}}
#cross{position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(207,201,168,.55);pointer-events:none}
#toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#000;border:2px solid var(--p);color:var(--p);padding:6px 14px;font-size:13px;max-width:80%;text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:9}
#toast.show{opacity:1;top:24px}
#iprompt{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);border:2px solid var(--w);color:var(--w);padding:8px 16px;font-size:14px;display:none;z-index:4;white-space:nowrap}
#fader{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .45s;pointer-events:none;z-index:7}
#pov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.78);z-index:8}
#pov.show{display:flex}
#pov h2{color:var(--w);letter-spacing:3px;margin:0 0 8px}
#mctl{display:none}
body.touch #mctl{display:block}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(207,201,168,.4);background:rgba(0,0,0,.25);display:none;z-index:5;pointer-events:none}
#knob{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(207,201,168,.55);left:34px;top:34px}
.mb{position:absolute;border-radius:50%;border:2px solid rgba(207,201,168,.5);background:rgba(0,0,0,.4);color:var(--b);font-size:20px;font-weight:900;z-index:5;touch-action:none}
#bJump{right:24px;bottom:96px;width:74px;height:74px}
#bSprint{right:112px;bottom:44px;width:54px;height:54px;font-size:15px}
#bSprint.on{background:var(--pd);color:#0a0a06;border-color:var(--p)}
#bAct{right:24px;bottom:190px;min-width:120px;border-radius:14px;padding:12px 14px;font-size:12px;border-color:var(--w);color:var(--w);display:none}
#bPause{right:10px;top:10px;width:44px;height:44px;border-radius:10px;font-size:15px}
#hud{width:250px;background:linear-gradient(180deg,#26271f,#161711);border-left:4px solid var(--r);padding:12px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;z-index:3}
.pn{background:var(--c);border:2px solid #000;box-shadow:inset 0 0 0 1px #4c4c3a;padding:9px}
.pn h2{margin:0 0 7px;font-size:12px;color:var(--p);letter-spacing:2px;border-bottom:1px dashed var(--pd);padding-bottom:4px}
#bgauge{height:16px;background:#0a0a06;border:1px solid #000;overflow:hidden}
#bfill{height:100%;width:100%;background:linear-gradient(90deg,var(--bl),var(--w),var(--p))}
#blab{font-size:11px;margin-top:4px}
#tval{font-size:22px;color:var(--p)}
@keyframes tp{50%{opacity:.3}}
#tval.alarm{color:#e05a3c;animation:tp .8s infinite}
#sval{font-size:22px;color:var(--w)}
#inv{list-style:none;margin:0;padding:0;font-size:12px;max-height:110px;overflow-y:auto}
#inv li{padding:3px 2px;border-bottom:1px solid #000;display:flex;justify-content:space-between;align-items:center;gap:5px}

#mmc{width:100%;background:#050502;border:1px solid #000;display:block}
.lg{font-size:11px;line-height:1.55;color:#a7a48c}
#chatlog{max-height:100px;overflow-y:auto;font-size:11px;line-height:1.45;background:#111207;border:1px solid #000;padding:4px;word-break:break-word}
.cm .n{color:var(--p);margin-right:4px;font-weight:bold}
.cm.me .n{color:var(--w)}
#chatin{flex:1;min-width:0;padding:6px;background:#111207;border:1px solid #4c4c3a;color:var(--b);font-family:inherit;font-size:12px}
#bHud{display:none}
@media(max-width:840px){
#hud{position:absolute;top:0;right:0;height:100%;transform:translateX(100%);transition:transform .25s;z-index:6}
#hud.open{transform:none}
#bHud{display:block;position:fixed;right:8px;top:62px;z-index:6;background:rgba(0,0,0,.6);border:2px solid var(--r);color:var(--b);padding:8px 10px;border-radius:8px}
}
#menu{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#14160f,#050503 75%);display:flex;align-items:center;justify-content:center;z-index:30;overflow-y:auto;padding:18px}

.mbox{width:min(660px,96vw);max-height:92vh;overflow-y:auto;background:var(--c);border:3px solid var(--r);box-shadow:0 0 0 6px #000;padding:20px 22px;margin:12px 0}
.lg2{font-size:28px;font-weight:900;letter-spacing:4px;color:var(--w);text-shadow:2px 2px 0 #000;text-align:center}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

.tabs button.on{background:var(--pd);color:#0a0a06;border-color:var(--p)}
.tb{display:none}.tb.on{display:block}
.tb h3{color:var(--p);letter-spacing:2px;font-size:13px;margin:14px 0 8px;border-bottom:1px dashed var(--pd);padding-bottom:4px}

.lore{font-size:13px;line-height:1.65}

.btn{display:inline-block;margin-top:14px;padding:10px 22px;background:var(--r);color:#0a0a06;border:none;font-weight:900;letter-spacing:2px;cursor:pointer;box-shadow:0 4px 0 #5c2c10}

.btn.g{background:#3a3b30;color:var(--b);box-shadow:0 4px 0 #16170f}
.btn.big{width:100%;padding:14px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select{background:#111207;border:1px solid #4c4c3a;color:var(--b);font-family:inherit;padding:9px;width:100%}
.chk{display:flex;gap:8px;align-items:center;font-size:12px;color:#c8c4a8;margin:8px 0;cursor:pointer}
.jr{display:flex;gap:6px;margin-top:6px;align-items:center}
.slist{margin-top:6px;max-height:220px;overflow-y:auto;border:1px solid #000;background:#111207}
.sr{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #20221a;font-size:12px}

.mini{background:#26271f;border:1px solid #4c4c3a;color:#a7a48c;cursor:pointer;padding:5px 10px;font-family:inherit;font-size:11px;white-space:nowrap}
.mini:disabled{opacity:.4}
.sg{display:flex;flex-wrap:wrap;gap:8px}
.sk{width:118px;background:#111207;border:1px solid #000;padding:8px;text-align:center;font-size:11px}
.sk img{width:100%;height:62px;object-fit:contain;background:#111207;border:1px solid #000;margin-bottom:6px}

.wi{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px solid #20221a;font-size:12px;flex-wrap:wrap}

.ps{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;font-size:12px}

#lmsg,#sstat{font-size:12px;min-height:16px;color:#b06b3a;margin-top:8px}
.mpic{width:38px;height:38px;flex:0 0 38px;border:1px solid #000;background:#111207}
.ipic{width:26px;height:26px;flex:0 0 26px}
.modal{position:fixed;inset:0;background:rgba(4,4,2,.92);display:none;align-items:center;justify-content:center;z-index:40;overflow-y:auto;padding:16px}
.modal.show{display:flex}
.modal .card{max-width:560px;width:92%;background:var(--c);border:3px solid var(--r);padding:22px;margin:12px 0}
.modal h2{color:var(--w);margin-top:0;letter-spacing:2px}
.modal h3{color:var(--p);font-size:13px;letter-spacing:2px;margin:14px 0 8px;border-bottom:1px dashed var(--pd);padding-bottom:4px}
.mr{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #20221a;font-size:12px;flex-wrap:wrap}
.mr .nm{flex:1;min-width:120px}
.mr .pr{color:var(--w);font-weight:900}
#rb{margin:10px 0;font-size:13px}
#rb div{display:flex;justify-content:space-between;border-bottom:1px dotted #555;padding:3px 0}
</style>
</head>

  cb(HUB.list);
 });

function ensureHub(cb){
 if(!window.Peer){if(window.__warn)window.__warn();drawSrv();if(cb)cb(HUB.list);return}
 if(HUB.own){cb(HUB.list);return}
 if(HUB.cn&&HUB.cn.open){cb(HUB.list);return}
 var br=new Peer({debug:0});HUB.lob=br;
 var i=0,fin=false,sa=setTimeout(function(){if(!fin){fin=true;claimHub(0,cb)}},9000);
 br.on('error',function(){});
 function next(){
  if(fin)return;
  if(i>=HIDS.length){fin=true;clearTimeout(sa);try{br.destroy()}catch(e){}claimHub(0,cb);return}
  var id=HIDS[i++],op=false,cn=br.connect(id,{reliable:true});
  var t=setTimeout(function(){if(!op){try{cn.close()}catch(e){}next()}},1800);
  cn.on('open',function(){
   op=true;clearTimeout(t);HUB.cn=cn;
   cn.on('data',function(d){try{
    if(!d)return;
    if(d.type==='list'){HUB.list=d.servers||[];drawSrv()}
    else if(d.type==='announce'&&d.srv){var f=-1;for(var j=0;j<HUB.list.length;j++)if(HUB.list[j].code===d.srv.code)f=j;if(f>=0)HUB.list[f]=d.srv;else HUB.list.push(d.srv);drawSrv()}
    else if(d.type==='remove'){HUB.list=HUB.list.filter(function(s){return s.code!==d.code});drawSrv()}
   }catch(e){}});
   cn.on('close',function(){if(HUB.cn===cn){HUB.cn=null;HUB.list=[]}});
   if(!fin){fin=true;clearTimeout(sa)}
   cb(HUB.list);
  });
  cn.on('error',function(){if(!op){clearTimeout(t);next()}});
  cn.on('close',function(){if(!op){clearTimeout(t)}});
 }
 br.on('open',next);
}

function update(dt){
 var f=0,s=0;
 if(!isT){
  f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
  s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
 }
 if(joy.on){f+=-joy.y;s+=joy.x}
 var ml=Math.hypot(f,s);
 if(ml>1){f/=ml;s/=ml}
 var spr2=(keys.ShiftLeft||keys.ShiftRight||spr)&&ml>.01;
 var bs=zone===ZS?4.2:3.4,sp=bs*(admSpd?2:1)*(spr2?1.55:1)*(zone===ZB&&bat<15&&!godBat?.8:1);
 var yaw=YO.rotation.y;
 var tx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp;
 var tz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp;
 var k=Math.min(1,12*dt);
 VX+=(tx-VX)*k;VZ+=(tz-VZ)*k;
 move(VX*dt,VZ*dt);
 if(jq&&PL.y<=.001)VY=5.2;
 jq=false;
 VY-=13.8*dt;PL.y+=VY*dt;
 if(PL.y<=0){PL.y=0;VY=Math.max(VY,0)}
 if(zone===ZB&&PL.y>1.05){PL.y=1.05;VY=Math.min(VY,0)}
 var hs=Math.hypot(VX,VZ);
 if(PL.y<=.001&&hs>.3)bob+=hs*dt*2.2;
 var bb=Math.sin(bob)*.05*Math.min(1,hs/3);
 YO.position.set(PL.x,EYE+PL.y+bb,PL.z);
 if(VM){VM.position.y=Math.sin(bob)*.012*Math.min(1,hs/3);VM.position.x=Math.cos(bob*.5)*.008}
 var wf=(spr2&&hs>2)?78:72;
 if(Math.abs(CM.fov-wf)>.2){CM.fov+=(wf-CM.fov)*Math.min(1,6*dt);CM.updateProjectionMatrix()}
 if(zone===ZB){
  if(godBat)bat=100;
  else{bat-=dt*((spr2&&hs>2)?.5:.28)*(torch?1:.15);if(bat<=0){bat=0;endRun('dark');return}}
 }
 FL.intensity=torch?(.35+1.25*Math.max(0,bat)/100):0;
 FL.distance=bat>55?12:bat>28?9.5:bat>10?7:5;
 if(alarm&&!frzT){
  rtime-=dt;
  if(!w60&&rtime<=60){w60=true;toast(L.alarm60)}
  if(!w10&&rtime<=10){w10=true;toast(L.alarm10)}
  if(rtime<=0){endRun('caught');return}
 }
 if(zone===ZB){
  var tp=[];
  for(var key in items)if(Math.hypot(PL.x-items[key].s.position.x,PL.z-items[key].s.position.z)<1.2)tp.push(key);
  for(var i2=0;i2<tp.length;i2++)pickIt(tp[i2]);
  markEx();
 }
 for(var i=0;i<crates.length;i++){
  var c=crates[i];
  if(c.open&&c.an<1){c.an=Math.min(1,c.an+dt*1.6);c.lp.rotation.x=-1.85*(1-Math.pow(1-c.an,2))}
 }
 if(grateP)grateP.rotation.z+=(grateT-grateP.rotation.z)*Math.min(1,3*dt);
 scan();bars();
 mmA+=dt;if(mmA>.15){mmA=0;drawMM()}
 if(NET.on){
  posA+=dt;
  if(posA>.1){
   posA=0;
   send({type:'pos',x:+PL.x.toFixed(2),z:+PL.z.toFixed(2),y:+PL.y.toFixed(2),yaw:+YO.rotation.y.toFixed(3),name:pname,mask:worn,zone:zone,spd:+hs.toFixed(1)});
  }
 }
}
function ambient(ts){
 if(!bunkG)return;
 for(var i=0;i<lamps.length;i++){
  var l=lamps[i];
  l.l.intensity=l.base*(.7+.3*Math.sin(ts*6+l.ph));
  var s=1+.08*Math.sin(ts*6+l.ph);
  l.g.scale.set(1.3*s,1.3*s,1);
 }
 for(var k in items){var sp=items[k].s;sp.position.y=1.25+Math.sin(ts*2.2+sp.userData)*.1}
 var v=alarm?(Math.sin(ts*8)>0?2.4:.15):0;
 for(var j=0;j<alights.length;j++)alights[j].intensity=v;
}
var lastT=performance.now();
function frame(t){
 requestAnimationFrame(frame);
 var dt=Math.min(.05,(t-lastT)/1000);lastT=t;
 if(started&&run&&!paused&&!over)update(dt);
 if(started){drawRem(dt);ambient(t/1000)}
 if(RD&&SN&&CM)RD.render(SN,CM);
}

};

 else{$('pinMsg2').textContent=L.admPinBad;$('pinIn2').value=''}
};

try{initProf()}catch(e){if(window.__err)window.__err('profile: '+(e&&e.message||e));try{showLogin()}catch(e2){}}
try{drawMM()}catch(e){}
console.log('[B17] OK');
